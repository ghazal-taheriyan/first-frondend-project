<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body>
 <header class="grid grid-cols-3 items-center px-8 py-6 m-2">
<div class="flex justify-start items-center gap-4 border-b border-amber-400 pb-3 w-fit" >
<input class=" bg-transparent w-40 text-sm outline-none" type="search" placeholder="Search Anythings..." >
<i class="fa-solid fa-magnifying-glass text-lg "></i>
</div>
<div class="flex justify-center">
  <a href="#" class="logo text-3xl font-bold">Woodex</a>
</div>
<div class="flex justify-end gap-7 items-center">
<i class="fa-regular fa-user"></i>
<div class="relative cursor-pointer">
  <i class="fa-regular fa-heart"></i>
  <span class="absolute -right-2 -bottom-2 flex h-4 w-4 items-center justify-center rounded-full bg-orange-200 text-xs ">0</span>
</div>
<div class="relative cursor-pointer">
  <i class="fa-solid fa-bag-shopping"></i>
    <span class="absolute -right-2 -bottom-2 flex h-4 w-4 items-center justify-center rounded-full bg-orange-200 text-xs ">0</span>

</div>

<i class="fa-solid fa-bars"></i>
</div>
 </header>

<section class="px-6 py-12">

  <div class="grid grid-cols-4 grid-rows-2 gap-[10px] h-[600px]">

    <!-- Card 1 -->
    <div class="relative overflow-hidden">
      <span class="absolute font-bold left-8 top-8">Art Deco Home</span>
      <p class="absolute left-8 top-16">Decoration</p>
      <img
        class="w-full h-full object-cover"
        src="/src/assets/hero-product-1.jpg"
      >
    </div>

    <!-- Card 2 -->
    <div class="relative col-span-2 overflow-hidden">
      <span class="absolute font-bold left-8 top-8">Helen Chair</span>
      <p class="absolute left-8 top-16">Decoration</p>
      <img
        class="w-full h-full object-cover"
        src="/src/assets/hero-product-2.jpg"
      >
    </div>

    <!-- Card 3 -->
    <div class="relative overflow-hidden">
      <span class="absolute font-bold left-8 top-8">Vase Of Flowers</span>
      <p class="absolute left-8 top-16">Decoration</p>
      <img
        class="w-full h-full object-cover"
        src="/src/assets/hero-product-3.jpg"
      >
    </div>

    <!-- Card 4 -->
    <div class="relative col-span-2 overflow-hidden">
      <span class="absolute font-bold left-8 top-8">Wood Eggs</span>
      <p class="absolute left-8 top-16">Decoration</p>
      <img
        class="w-full h-full object-cover"
        src="/src/assets/hero-product-4.jpg"
      >
    </div>

    <!-- Card 5 -->
    <div class="relative col-span-2 overflow-hidden">
      <span class="absolute font-bold left-8 top-8">Table Wood Pine</span>
      <p class="absolute left-8 top-16">Furniture</p>
      <img
        class="w-full h-full object-cover"
        src="/src/assets/hero-product-5.jpg"
      >
    </div>

  </div>

</section>



 <script type="module" src="src/main.js"></script>
</body>
</html>
